version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_summarizer_db
    environment:
      POSTGRES_DB: ai_summarizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
